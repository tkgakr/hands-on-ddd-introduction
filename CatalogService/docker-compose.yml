services:
  localdb:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=localdb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d localdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      localdb:
        condition: service_healthy
    environment:
      - DB_HOST=localdb
      - DB_PORT=5432
      - DB_NAME=localdb
      - DB_USER=postgres
      - DB_PASSWORD=password
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npx ts-node
      src/Infrastructure/SQL/migrations/runMigrations.ts init.sql
      create_event_table.sql drop_review_table.sql"

volumes:
  postgres_data:
  node_modules:
